context:
  version: 1.6.0
  python_min: '3.11'

package:
  name: diffly
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/d/diffly/diffly-${{ version }}.tar.gz
  sha256: d65ca2dc3dfab657badf635cbae85c83c677563e9966c187038c859bd8cb787c

build:
  python:
    entry_points:
      - diffly = diffly.cli:app
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - polars >=1.32,<3
    - rich
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - diffly
      pip_check: true

about:
  homepage: https://pypi.org/project/diffly
  repository: https://github.com/quantco/diffly
  documentation: https://diffly.readthedocs.io/stable
  summary: Utility package for comparing polars dataframes.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - EgeKaraismailogluQC
    - MariusMerkleQC
    - borchero
